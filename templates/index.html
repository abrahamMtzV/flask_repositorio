<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Avisos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container mt-5">
    <h1 class="mb-4">Avisos Recientes</h1>

    <div class="row">
        {% for aviso in avisos %}
        <div class="col-md-6 mb-4">
          <div class="card shadow">
            <div class="card-body">
              <h5 class="card-title">{{ aviso[1] }}</h5>
              <p class="card-text">{{ aviso[2] }}</p>
              <p class="text-muted"><small>Fecha: {{ aviso[3] }}</small></p>
            </div>
          </div>
        </div>
      {% endfor %}      
    </div>

  </div>
</body>
</html>
